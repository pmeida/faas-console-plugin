apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    app: {{ .Name }}
    app.kubernetes.io/name: {{ .Name }}
    app.kubernetes.io/part-of: {{ .Name }}
    app.kubernetes.io/managed-by: func-operator
rules:
  # The plugin keeps SCM credentials in Secrets in its own namespace.
  # A user owns one Secret, named after their identity, so reconnecting
  # overwrites it instead of adding another: hence update alongside create.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete"]
