apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: {{ .Name }}
  labels:
    app: {{ .Name }}
    app.kubernetes.io/name: {{ .Name }}
    app.kubernetes.io/part-of: {{ .Name }}
    app.kubernetes.io/managed-by: func-operator
spec:
  displayName: OpenShift Serverless Functions Console Plugin
  i18n:
    loadType: Preload
  backend:
    type: Service
    service:
      name: {{ .Name }}
      namespace: {{ .Namespace }}
      port: 9443
      basePath: /
  proxy:
    - alias: backend
      authorization: UserToken
      endpoint:
        type: Service
        service:
          name: {{ .Name }}
          namespace: {{ .Namespace }}
          port: 9443
