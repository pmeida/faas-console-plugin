apiVersion: v1
kind: Service
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    app: {{ .Name }}
    app.kubernetes.io/name: {{ .Name }}
    app.kubernetes.io/part-of: {{ .Name }}
    app.kubernetes.io/managed-by: func-operator
  annotations:
    service.alpha.openshift.io/serving-cert-secret-name: {{ .CertSecret }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Name }}
    app.kubernetes.io/name: {{ .Name }}
  ports:
    - name: 9443-tcp
      protocol: TCP
      port: 9443
      targetPort: 9443
